# ========================================================
# SERVER CONFIGURATION
# ========================================================
server.port=8080
server.error.include-message=always

# ========================================================
# POSTGRESQL DATABASE CONFIGURATION
# Supports environment variables with development defaults
# Note: default port is 5433 (or 5432 depending on setup)
# ========================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:dpg-db2scr67bikc73aqt4bg-a.ohio-postgres.render.com}:${DB_PORT:5432}/${DB_NAME:mvecm_db}?sslmode=require
spring.datasource.username=${DB_USERNAME:mvecm_db_user}
spring.datasource.password=${DB_PASSWORD:nzb0m53ZgyqO4vqpBBOGAkwIV0gHUhjj}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================================================
# JWT SECURITY CONFIGURATION
# ========================================================
# 256-bit secret key for HMAC-SHA
app.jwt.secret=9a4f2c8d7e1b5a3f6e8d2c1b4a7f9e3d5b8c2a1f4e7d9b3a6c8e1f5d2b7a9c3e
# 24 hours in milliseconds (86400000)
app.jwt.expiration-ms=86400000

# ========================================================
# SPRING MAIL / SMTP CONFIGURATION
# For Gmail, generate an 'App Password' from Google Security
# ========================================================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:noreply.mvecm@gmail.com}
spring.mail.password=${SMTP_PASSWORD:your-smtp-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Developer OTP mode: prints OTP in console and returns it in debug response if SMTP is unconfigured
app.otp.dev-mode=${DEV_OTP_MODE:true}
app.otp.expiry-minutes=5
app.otp.max-attempts=3

# ========================================================
# LOGGING
# ========================================================
logging.level.com.mvecm=INFO
logging.level.org.springframework.security=INFO
